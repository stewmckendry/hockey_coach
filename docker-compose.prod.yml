version: '3.8'

services:
  # Hockey MCP Server
  hockey-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8000:8000"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_SERVER_HOST=${CHROMA_SERVER_HOST}
      - CHROMA_SERVER_HTTP_PORT=${CHROMA_SERVER_HTTP_PORT}
      - CHROMA_TOKEN=${CHROMA_TOKEN}
    networks:
      - hockey_network
    restart: unless-stopped

  # Bridge API
  hockey-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    ports:
      - "3003:3003"
    environment:
      - ENVIRONMENT=production
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=3003
      - MCP_SERVER_URL=http://hockey-mcp:8000/mcp
    depends_on:
      - hockey-mcp
    networks:
      - hockey_network
    restart: unless-stopped

  # Next.js Web App
  web-app:
    build:
      context: ./web_app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOCKEY_MCP_DIRECT_URL=http://hockey-bridge:3003
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - hockey-bridge
    networks:
      - hockey_network
    restart: unless-stopped

networks:
  hockey_network:
    driver: bridge
